<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroFeira — Fechar o pedido</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Tokens do projeto (variáveis globais) -->
  <link rel="stylesheet" href="tokens.css">

  <!-- Mapeamento Bootstrap + Tokens (deve vir por último) -->
  <link rel="stylesheet" href="agrofeira-bootstrap.css">

  <!-- Script de validação do Bootstrap -->
  <script src="validacao.js" defer></script>
</head>

<body>
  <main class="container py-4">
    <h1 class="h3 mb-4">Fechar o pedido</h1>

    <form class="row g-3 needs-validation" novalidate>
      
      <!-- Nome completo -->
      <div class="col-12 col-md-6">
        <label for="nome" class="form-label">Nome completo</label>
        <input type="text" class="form-control" id="nome" name="nome" autocomplete="name" required aria-describedby="nome-erro">
        <div id="nome-erro" class="invalid-feedback">Informe o seu nome.</div>
      </div>

      <!-- E-mail -->
      <div class="col-12 col-md-6">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" autocomplete="email" required aria-describedby="email-erro">
        <div id="email-erro" class="invalid-feedback">Informe um e-mail, como maria@exemplo.com.br.</div>
      </div>

      <!-- Aceite dos termos -->
      <div class="col-12">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="termos" name="termos" required aria-describedby="termos-erro">
          <label class="form-check-label" for="termos">Li e aceito as regras da feira</label>
          <div id="termos-erro" class="invalid-feedback">É preciso aceitar as regras para continuar.</div>
        </div>
      </div>

      <!-- Botão de Envio -->
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Fazer pedido</button>
      </div>

    </form>
  </main>
</body>

</html>
