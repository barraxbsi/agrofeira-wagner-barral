<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroFeira — catálogo (Bootstrap)</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <!-- Contêiner Principal -->
  <div class="container">
    
    <!-- Cabeçalho -->
    <header class="d-flex justify-content-between align-items-center py-3 mb-4">
      <h1 class="display-6 mb-0">AgroFeira</h1>
      <a href="index.html">Início</a>
    </header>

    <!-- Linha da Grade (Divisão em colunas) -->
    <div class="row g-4">
      
      <!-- Coluna Principal (main) -->
      <main class="col-lg-9">
        <!-- 1. O aviso -->
        <div class="alert alert-warning" role="alert">
          Entregas só às sextas-feiras. Pedidos até quinta, às 18h.
        </div>

        <!-- 2. O título e a frase -->
        <h2>Produtos da semana</h2>
        <p class="lead">O que chegou das colônias de Paragominas nesta semana.</p>

        <!-- 3. A lista de produtos (linha da grade) -->
        <ul class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3 list-unstyled">
          <!-- Os itens <li> entrarão nos Passos 5 e 6 -->
        </ul>
      </main>

      <!-- Coluna Lateral (aside) -->
      <aside class="col-lg-3 d-none d-lg-block">
        <h2 class="h5">Mais pedidos</h2>
        <ol class="list-group list-group-numbered">
          <li class="list-group-item">Açaí médio</li>
          <li class="list-group-item">Farinha d'água</li>
          <li class="list-group-item">Polpa de cupuaçu</li>
        </ol>
      </aside>

    </div>

  </div>
</body>

</html>
