<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtor | AgroFeira de Paragominas</title>
    <!-- Google Fonts (Substitua pela sua fonte escolhida) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=NOME_DA_FONTE:wght@400;700&display=swap" rel="stylesheet">

    <!-- Folhas de estilo da aplicação -->
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="estilo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@600&display=swap" rel="stylesheet">

</head>

<body>
    <!-- Link de acesso rápido para leitores de tela -->
    <a href="#conteudo-principal" class="pular">Pular para o conteúdo principal</a>

    <!-- Cabeçalho e Navegação Principal -->
    <header class="cabecalho-site">
        <h1>AgroFeira de Paragominas</h1>
        <nav aria-label="Principal">
            <ul class="menu">
                <li><a href="index.html">Início</a></li>
                <li><a href="safra.html">Safra</a></li>
                <li><a href="cadastro-produtor.html" aria-current="page">Cadastro de Produtor</a></li>
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <!-- Região de Conteúdo Principal -->
    <main id="conteudo-principal">
        <h2>Cadastro de Produtor</h2>

        <form action="#" method="post" class="formulario-cadastro">

            <!-- Primeiro Grupo: Dados do Produtor -->
            <fieldset>
                <legend>Quem é você</legend>

                <p>
                    <label for="nome">Nome completo</label><br>
                    <input type="text" id="nome" name="nome" required autocomplete="name">
                </p>

                <p>
                    <label for="email">E-mail</label><br>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </p>

                <p>
                    <label for="telefone">Telefone</label><br>
                    <input type="tel" id="telefone" name="telefone" autocomplete="tel">
                </p>

                <p>
                    <label for="caf">Número do CAF</label><br>
                    <input type="text" id="caf" name="caf">
                </p>

                <p>
                    <label for="cep">CEP da propriedade</label><br>
                    <input type="text" id="cep" name="cep" inputmode="numeric" pattern="\d{5}-?\d{3}"
                        aria-describedby="ajuda-cep">
                    <span id="ajuda-cep">Formato: 00000-000</span>
                </p>
            </fieldset>

            <!-- Segundo Grupo: Dados da Produção/Entrega -->
            <fieldset>
                <legend>O que você vende</legend>

                <p>
                    <label for="produto">Produto principal</label><br>
                    <select id="produto" name="produto" required>
                        <option value="">Escolha um produto</option>
                        <option value="mandioca">Mandioca</option>
                        <option value="banana-prata">Banana-prata</option>
                        <option value="acai">Açaí</option>
                        <option value="pimenta-do-reino">Pimenta-do-reino</option>
                        <option value="cupuacu">Cupuaçu</option>
                        <option value="alface">Alface</option>
                    </select>
                </p>

                <p>
                    <label for="quantidade">Quantidade por semana (em kg/unidades)</label><br>
                    <input type="number" id="quantidade" name="quantidade" required min="1" max="500" step="1">
                </p>

                <p>
                    <label for="data-inicio">Começa a entregar em</label><br>
                    <input type="date" id="data-inicio" name="data-inicio">
                </p>

                <!-- Grupo de botões de escolha -->
                <fieldset>
                    <legend>Como entrega</legend>
                    <p>
                        <input type="radio" id="entrega-levo" name="como-entrega" value="levo">
                        <label for="entrega-levo">Levo à feira</label>
                    </p>
                    <p>
                        <input type="radio" id="entrega-retira" name="como-entrega" value="retira">
                        <label for="entrega-retira">A feira retira na propriedade</label>
                    </p>
                </fieldset>

                <p>
                    <label for="observacao">Observação</label><br>
                    <textarea id="observacao" name="observacao" rows="4"></textarea>
                </p>

                <p>
                    <input type="checkbox" id="aceite" name="aceite" required>
                    <label for="aceite">Li e aceito as regras da feira</label>
                </p>
            </fieldset>

            <p>
                <button type="submit">Enviar formulário</button>
            </p>
        </form>

        <!-- Mensagem de status dinâmico para leitores de tela -->
        <p role="status" aria-live="polite"></p>
    </main>

    <!-- Rodapé -->
    <footer class="rodape-site">
        <p>AgroFeira Paragominas — Valorizando a agricultura local.</p>
    </footer>
</body>

</html>
